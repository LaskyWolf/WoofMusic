<style>
.f{animation:f 7s ease-in-out infinite}.f2{animation:f 7s ease-in-out -2.4s infinite}.f3{animation:f 7s ease-in-out -4.6s infinite}
@keyframes f{50%{transform:translateY(-12px)}}
.i0,.i1,.i2,.i3,.i4{transform-box:fill-box;transform-origin:center;animation-duration:6s;animation-iteration-count:infinite}
.i0{animation-name:pl}@keyframes pl{0%,6%,24%,100%{transform:none}11%{transform:translateX(5px) scale(1.18)}17%{transform:scale(.94)}}
.i1{animation-name:ht}@keyframes ht{0%,26%,44%,100%{transform:none}32%{transform:scale(1.32)}38%{transform:scale(.92)}}
.i2{animation-name:dl}@keyframes dl{0%,46%,64%,100%{transform:none}52%{transform:translateY(-7px)}58%{transform:translateY(3px) scale(1.08,.9)}}
.i3{animation-name:rp}@keyframes rp{0%,66%{transform:none}84%,100%{transform:rotate(360deg)}}
.i4{animation-name:mn}@keyframes mn{0%,84%,100%{transform:none}90%{transform:rotate(-16deg) scale(1.1)}96%{transform:rotate(8deg)}}
.eq{transform-box:fill-box;transform-origin:bottom;animation:eq 1.1s ease-in-out infinite alternate}
.eq2{animation-delay:-.4s}.eq3{animation-delay:-.8s}
@keyframes eq{to{transform:scaleY(.45)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style></defs>
