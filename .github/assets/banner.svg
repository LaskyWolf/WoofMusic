<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 560" width="1280" height="560" font-family="-apple-system,'SF Pro Display','Segoe UI',Roboto,Helvetica,Arial,sans-serif">
<defs>
<radialGradient id="gl"><stop offset="0" stop-color="#22c55e" stop-opacity=".55"/><stop offset=".45" stop-color="#15803d" stop-opacity=".18"/><stop offset="1" stop-color="#15803d" stop-opacity="0"/></radialGradient>
<radialGradient id="rd"><stop offset="0" stop-color="#ef4444" stop-opacity=".5"/><stop offset=".45" stop-color="#b91c1c" stop-opacity=".16"/><stop offset="1" stop-color="#b91c1c" stop-opacity="0"/></radialGradient>
<linearGradient id="titleGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5ef08a"/><stop offset="1" stop-color="#16a34a"/></linearGradient>
<linearGradient id="barG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff6b5e"/><stop offset="1" stop-color="#b91c1c"/></linearGradient>
<linearGradient id="ar1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff8a5c"/><stop offset="1" stop-color="#7a1f3d"/></linearGradient>
<linearGradient id="ar2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7b7bf5"/><stop offset="1" stop-color="#1a1733"/></linearGradient>
<linearGradient id="ar3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#45d6c0"/><stop offset="1" stop-color="#0d3b40"/></linearGradient>
<clipPath id="r"><rect width="1280" height="560" rx="28"/></clipPath>
<style>
.g1{animation:pulse 9s ease-in-out infinite alternate}
.g2{animation:pulse 9s ease-in-out -4.5s infinite alternate}
@keyframes pulse{to{opacity:.5}}
.eq{transform-box:fill-box;transform-origin:bottom;animation:eq 1.15s ease-in-out infinite alternate}
.eq2{animation-delay:-.38s}.eq3{animation-delay:-.76s}
@keyframes eq{to{transform:scaleY(.4)}}
.pg{transform-box:fill-box;transform-origin:left center;animation:pg 16s linear infinite}
@keyframes pg{from{transform:scaleX(.25)}to{transform:scaleX(1)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</defs>
<g clip-path="url(#r)"><rect width="1280" height="560" fill="#08090a"/>
<ellipse class="g1" cx="40" cy="510" rx="580" ry="430" fill="url(#gl)"/>
<ellipse class="g2" cx="1250" cy="30" rx="580" ry="440" fill="url(#rd)"/>
<g transform="translate(90 56)"><rect width="266" height="44" rx="22" fill="#ffffff10" stroke="#ffffff20"/><circle cx="26" cy="22" r="4.5" fill="#4ade80"/><text x="44" y="29" font-size="16.5" font-weight="600" fill="#dcdce2" letter-spacing="1.1">FORK OF WOOFMUSIC</text></g>
<text x="90" y="186" font-size="82" font-weight="800" fill="#fff" letter-spacing="-3">WoofMusic <tspan fill="url(#titleGrad)">Plus</tspan></text>
<text x="92" y="244" font-size="31" font-weight="600" fill="#fff">YouTube Music, native on iPhone.</text>
<text x="92" y="292" font-size="22" fill="#a3a3ab">Built on WoofMusic, with lyrics, karaoke and Canvas.</text>
