<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 560" width="1280" height="560" font-family="-apple-system,'SF Pro Display','Segoe UI',Roboto,Helvetica,Arial,sans-serif">
<defs><radialGradient id="a" cx=".82" cy=".1" r=".9"><stop offset="0" stop-color="#0a7bff" stop-opacity=".6"/><stop offset=".55" stop-color="#0a7bff" stop-opacity=".08"/><stop offset="1" stop-color="#0a7bff" stop-opacity="0"/></radialGradient>
