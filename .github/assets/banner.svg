<g transform="translate(90 398)"><rect width="175" height="46" rx="23" fill="#ffffff0d" stroke="#ffffff1a"/><circle cx="22" cy="23" r="4" fill="#4ade80"/><text x="38" y="29" font-size="16" font-weight="500" fill="#e8e8ec">DJ transitions</text></g>
<g transform="translate(277 398)"><rect width="116" height="46" rx="23" fill="#ffffff0d" stroke="#ffffff1a"/><circle cx="22" cy="23" r="4" fill="#4ade80"/><text x="38" y="29" font-size="16" font-weight="500" fill="#e8e8ec">Widgets</text></g>
<g transform="translate(740 64)"><rect width="450" height="116" rx="22" fill="#17181c" stroke="#ffffff1a"/><rect x="0" y="26" width="4" height="64" rx="2" fill="url(#barG)"/><rect x="24" y="22" width="72" height="72" rx="16" fill="url(#ar1)"/><text x="114" y="54" font-size="19" font-weight="700" fill="#fff">Neon Rain</text><text x="114" y="80" font-size="14" fill="#a3a3ab">Halcyon Drive</text><rect x="114" y="96" width="250" height="3" rx="1.5" fill="#ffffff12"/><rect class="pg" x="114" y="96" width="250" height="3" rx="1.5" fill="#ff5a4e"/><g fill="#ff5a4e"><rect class="eq" x="382" y="44" width="5" height="32" rx="2.5"/><rect class="eq eq2" x="391" y="44" width="5" height="32" rx="2.5"/><rect class="eq eq3" x="400" y="44" width="5" height="32" rx="2.5"/></g></g>
<g transform="translate(740 196)"><rect width="450" height="116" rx="22" fill="#141518" stroke="#ffffff14"/><rect x="0" y="26" width="4" height="64" rx="2" fill="#3a3a40"/><rect x="24" y="22" width="72" height="72" rx="16" fill="url(#ar2)"/><text x="114" y="54" font-size="19" font-weight="700" fill="#f0f0f2">Paper Moons</text><text x="114" y="80" font-size="14" fill="#a3a3ab">Aiko Rey</text><text x="428" y="54" font-size="14" fill="#75757d" text-anchor="end">4:07</text><rect x="114" y="96" width="250" height="3" rx="1.5" fill="#ffffff12"/></g>
<g transform="translate(740 328)"><rect width="450" height="116" rx="22" fill="#141518" stroke="#ffffff14"/><rect x="0" y="26" width="4" height="64" rx="2" fill="#3a3a40"/><rect x="24" y="22" width="72" height="72" rx="16" fill="url(#ar3)"/><text x="114" y="54" font-size="19" font-weight="700" fill="#f0f0f2">Halo Static</text><text x="114" y="80" font-size="14" fill="#a3a3ab">The Quiet Hours</text><text x="428" y="54" font-size="14" fill="#75757d" text-anchor="end">2:58</text><rect x="114" y="96" width="250" height="3" rx="1.5" fill="#ffffff12"/></g>
