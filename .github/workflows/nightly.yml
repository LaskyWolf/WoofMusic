name: Private iPhone Test Build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: private-iphone-test
  cancel-in-progress: false

env:
  FFMPEG_KIT_TAG: v9.0.0

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1.7.0
        with:
          xcode-version: latest-stable

      - name: Cache ffmpeg-kit XCFrameworks
        uses: actions/cache@v4
        with:
          path: build/ffmpeg-kit-xcframeworks
          key: ffmpeg-kit-${{ env.FFMPEG_KIT_TAG }}-arm64+sim-openssl-${{ runner.os }}

      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: build/DerivedDataApp
          key: trop-dd-${{ runner.os }}-${{ hashFiles('Trop.xcodeproj/**', '**/Package.resolved', 'Trop/**/*.swift') }}
          restore-keys: |
            trop-dd-${{ runner.os }}-

      - name: Check privacy regressions
        run: python3 scripts/check_privacy.py

      - name: Check player transition regressions
        run: python3 scripts/check_player_transition.py

      - name: Check Play Next ordering
        run: python3 scripts/check_play_next.py

      - name: Make build script executable
        run: chmod +x ./build_ipa.sh

      - name: Build iOS IPA
        run: ./build_ipa.sh
        env:
          FFMPEG_KIT_TAG: ${{ env.FFMPEG_KIT_TAG }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          CURRENT_PROJECT_VERSION: ${{ github.run_number }}

      - name: Upload iOS IPA artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: Trop-iOS
          path: build/Trop.ipa
          if-no-files-found: error
          retention-days: 7
