name: iPhone Build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iphone-build
  cancel-in-progress: false

env:
  FFMPEG_KIT_TAG: v9.0.0

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1.7.0
        with:
          xcode-version: latest-stable

      - name: Cache ffmpeg-kit XCFrameworks
        uses: actions/cache@v6.1.0
        with:
          path: build/ffmpeg-kit-xcframeworks
          key: ffmpeg-kit-${{ env.FFMPEG_KIT_TAG }}-arm64+sim-openssl-${{ runner.os }}

      - name: Cache DerivedData
        uses: actions/cache@v6.1.0
        with:
          path: build/DerivedDataApp
          key: trop-dd-${{ runner.os }}-${{ hashFiles('Trop.xcodeproj/**', '**/Package.resolved', 'Trop/**/*.swift') }}
          restore-keys: |
            trop-dd-${{ runner.os }}-

      - name: Make build script executable
        run: chmod +x ./build_ipa.sh

      - name: Download Discord Social SDK
        env:
          # The SDK must not be public: it lives in a private repo (DISCORD_SDK_REPO)
          # read with DISCORD_SDK_TOKEN. Without them this repo's own release is tried.
          GH_TOKEN: ${{ secrets.DISCORD_SDK_TOKEN || github.token }}
          DISCORD_SDK_REPO: ${{ vars.DISCORD_SDK_REPO || github.repository }}
        run: |
          set -euo pipefail
          ARCHIVE_DIR="$RUNNER_TEMP/discord-social-sdk-archive"
          EXTRACT_PATH="$RUNNER_TEMP/discord-social-sdk"
          rm -rf "$ARCHIVE_DIR" "$EXTRACT_PATH" build/discord
          mkdir -p "$ARCHIVE_DIR" "$EXTRACT_PATH" build/discord
          if ! gh release download discord-sdk --repo "$DISCORD_SDK_REPO" \
              --pattern 'DiscordSocialSdk-*.zip' --dir "$ARCHIVE_DIR"; then
            echo "::warning::Release 'discord-sdk' not found in $DISCORD_SDK_REPO - building without the Discord Social SDK."
            exit 0
          fi
          unzip -q "$ARCHIVE_DIR"/DiscordSocialSdk-*.zip -d "$EXTRACT_PATH"
          SDK_PATH="$(find "$EXTRACT_PATH" -type d -name 'discord_partner_sdk.xcframework' -print -quit)"
          test -n "$SDK_PATH"
          mv "$SDK_PATH" build/discord/discord_partner_sdk.xcframework

      - name: Build iOS IPA
        run: ./build_ipa.sh
        env:
          FFMPEG_KIT_TAG: ${{ env.FFMPEG_KIT_TAG }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          CURRENT_PROJECT_VERSION: ${{ github.run_number }}

      - name: Upload iOS IPA artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: WoofMusic-iOS
          path: build/WoofMusic-*.ipa
          if-no-files-found: error
          retention-days: 7
