name: Checks

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/checks.yml"
      - "scripts/**"
      - "**/*.swift"

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1.7.0
        with:
          xcode-version: latest-stable

      - name: Check privacy regressions
        run: python3 scripts/check_privacy.py

      - name: Check Play Next ordering
        run: python3 scripts/check_play_next.py

      - name: Check player song titles
        run: python3 scripts/check_song_title.py

      - name: Check track analyzer
        run: python3 scripts/check_track_analyzer.py

      - name: Check player transition in Simulator
        run: python3 scripts/check_player_surface.py

      - name: Upload player surface screenshots
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: Player-surface-check
          path: build/player-surface-check
          retention-days: 7
